<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tadano PM | Google Maps CRM V3</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,sans-serif;color:#142238;background:#f1f5f9}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#13253e;color:#fff;padding:10px 14px}.top strong{font-size:15px}.top small{color:#c8d6e8}.settings{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:white;border-bottom:1px solid #e2e8f0}.settings input{padding:9px;border:1px solid #cbd5e1;border-radius:6px;width:min(250px,50vw)}button{padding:9px 12px;border:0;border-radius:6px;background:#c82336;color:white;font-weight:600;cursor:pointer}.muted{background:#e2e8f0;color:#243349}.status{padding:7px 12px;background:#edf2f8;color:#41546d;font-size:12px;min-height:30px}#map{height:calc(100vh - 129px);min-height:350px}.fallback{height:100%;display:grid;place-items:center;padding:24px;text-align:center;color:#64748b}.legend{position:absolute;bottom:24px;left:12px;z-index:1;background:white;padding:8px;border-radius:8px;box-shadow:0 1px 9px #0002;font-size:12px}.legend span{margin-right:10px;white-space:nowrap}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}body.embedded .top{padding:8px 12px}body.embedded #map{height:calc(100vh - 117px)}@media(max-width:600px){.settings{font-size:12px}.legend{font-size:10px;max-width:90%;line-height:1.8}}
</style></head><body><div class="top"><div><strong>TADANO PM · Google Maps</strong><br><small>Carte commerciale France métropolitaine</small></div><small>V3</small></div><div class="settings"><label for="key">Clé Maps</label><input id="key" type="password" autocomplete="off" placeholder="Clé API Google Maps"><button id="load">Afficher la carte</button><button id="forget" class="muted">Effacer la clé</button></div><div class="status" id="status">Saisis la clé une fois, puis affiche la carte.</div><div id="map"><div class="fallback">Carte Google Maps à initialiser.</div></div><div class="legend"><span><i class="dot" style="background:#2674c8"></i>Carrossier</span><span><i class="dot" style="background:#239b73"></i>Point service</span><span><i class="dot" style="background:#e58a32"></i>Client final</span><span><i class="dot" style="background:#8661c5"></i>Prospect</span></div>
<script>
'use strict';
const $=x=>document.getElementById(x);const STORE='tadano_maps_browser_key';$('key').value=localStorage.getItem(STORE)||'';
let map=null,markers=[],pending=[],loading=false,info=null;const COLORS={'Carrossier':'#2674c8','Point service':'#239b73','Client final':'#e58a32','Client potentiel':'#8661c5'};
const status=t=>$('status').textContent=t;
// Only accept public map-marker data from the embedding Chrome extension.
// No commercial notes, contacts, emails or CRM opportunity data are exchanged.
function trustedParent(e){return e.source===window.parent&&/^chrome-extension:\/\/[a-p]{32}$/.test(e.origin);}
window.addEventListener('message',e=>{if(!trustedParent(e))return;const d=e.data||{};if(d.type==='TADANO_PING_V3'){notify();return;}if(d.type==='TADANO_MARKERS_V3'&&Array.isArray(d.markers)){pending=d.markers.slice(0,25000).filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&Number.isFinite(p.lat)&&Number.isFinite(p.lng)&&p.lat>=41&&p.lat<=52&&p.lng>=-6&&p.lng<=10).map(p=>({id:p.id.slice(0,128),name:p.name.slice(0,180),lat:p.lat,lng:p.lng,category:String(p.category||'').slice(0,50),city:String(p.city||'').slice(0,100),network:String(p.network||'').slice(0,100)}));draw();}});
function notify(){if(window.parent!==window)window.parent.postMessage({type:'TADANO_MAP_READY_V3'},'*');}
function draw(){if(!map||!window.google)return;markers.forEach(m=>m.setMap(null));markers=[];if(info)info.close();for(const p of pending){const m=new google.maps.Marker({position:{lat:p.lat,lng:p.lng},map,title:p.name,icon:{path:google.maps.SymbolPath.CIRCLE,scale:7,fillColor:COLORS[p.category]||'#64748b',fillOpacity:1,strokeColor:'#fff',strokeWeight:2}});m.addListener('click',()=>{info=info||new google.maps.InfoWindow();const div=document.createElement('div');const title=document.createElement('strong');title.textContent=p.name;div.append(title);const subtitle=document.createElement('p');subtitle.textContent=[p.city,p.category,p.network].filter(Boolean).join(' · ');div.append(subtitle);info.setContent(div);info.open({anchor:m,map});if(window.parent!==window)window.parent.postMessage({type:'TADANO_SELECT_V3',id:p.id},'*');});markers.push(m);}status('Carte active · '+markers.length+' établissement(s) positionné(s).');}
window.initTadanoMap=()=>{try{map=new google.maps.Map($('map'),{center:{lat:46.603354,lng:1.888334},zoom:6,mapTypeControl:true,streetViewControl:false,fullscreenControl:true});draw();notify();}catch(e){status('Erreur de carte : '+e.message);}};
window.gm_authFailure=()=>{status('Google Maps a refusé la clé : vérifie facturation, restrictions et API.');loading=false;};
$('load').onclick=()=>{if(loading||map)return;const key=$('key').value.trim();if(!/^AIza[\w-]{20,}$/.test(key)){status('Clé Google Maps non valide.');return;}localStorage.setItem(STORE,key);loading=true;status('Chargement de Google Maps…');const s=document.createElement('script');s.async=true;s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&callback=initTadanoMap&loading=async';s.onerror=()=>{status('Impossible de charger Google Maps.');loading=false;};document.head.appendChild(s);};
$('forget').onclick=()=>{localStorage.removeItem(STORE);$('key').value='';status('Clé effacée. Recharge la page pour réinitialiser Google Maps.');};
if(window.parent!==window)document.body.classList.add('embedded');
notify();
</script></body></html>
